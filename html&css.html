<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 400px;
            background: white;
            padding: 20px;
            margin: 50px auto;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .gender {
            margin-bottom: 15px;
        }

        .buttons {
            text-align: center;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 8px 15px;
            margin: 5px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="reset"] {
            background-color: #6c757d;
        }

        input[type="submit"]:hover,
        input[type="reset"]:hover {
            opacity: 0.9;
        }
		.error 
		{
    color: red;
    font-size: 13px;
    margin-top: -10px;
    margin-bottom: 10px;
}

.invalid
 {
    border: 2px solid red !important;
}

    </style>
</head>

<body>

<div class="container">
    <h2>Student Registration Form</h2>

    <form onsubmit="return validateForm(event);">

        <!-- Register Number -->
        <label>Register Number:</label>
        <input type="number" name="reg_number"
        placeholder="Enter register number"
        oninput="limitRegNumber(this)"
        required>

        <!-- Student Name -->
        <label>Student Name:</label>
        <input type="text" name="student_name"
        placeholder="Enter your name"
        oninput="validateName(this)"
        required>

        <!-- Email -->
        <label>Email:</label>
        <input type="email" name="email"
        placeholder="Enter your email"
        oninput="validateEmail(this)"
        required>

        <!-- Age -->
        <label>Age:</label>
        <input type="number" name="age"
        placeholder="Enter your age"
        required>

        <!-- Gender -->
        <label>Gender:</label>
        <div class="gender">
            <input type="radio" name="gender" value="Male" required> Male
            <input type="radio" name="gender" value="Female"> Female
        </div>

        <!-- Course -->
        <label>Course:</label>
        <select name="course" required>
            <option value="">Select course</option>
            <option>Computer Science</option>
            <option>IT</option>
            <option>Mechanical</option>
            <option>Electrical</option>
        </select>

        <div class="buttons">
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </div>

    </form>
</div>

<script>

function showError(input, message) {
    input.classList.add("invalid");

    let error = input.nextElementSibling;
    if (!error || !error.classList.contains("error")) {
        error = document.createElement("div");
        error.className = "error";
        input.parentNode.insertBefore(error, input.nextSibling);
    }
    error.innerText = message;
}

function clearError(input) {
    input.classList.remove("invalid");

    let error = input.nextElementSibling;
    if (error && error.classList.contains("error")) {
        error.remove();
    }
}

// Register Number Validation
document.getElementsByName("reg_number")[0].addEventListener("blur", function() {
    let value = this.value;
    if (!/^\d{10}$/.test(value)) {
        showError(this, "Register Number must be exactly 10 digits");
        this.focus();
    } else {
        clearError(this);
    }
});

// Name Validation
document.getElementsByName("student_name")[0].addEventListener("blur", function() {
    let value = this.value;
    if (!/^[A-Za-z\s]+$/.test(value)) {
        showError(this, "Name must contain only letters");
        this.focus();
    } else {
        clearError(this);
    }
});

// Email Validation
document.getElementsByName("email")[0].addEventListener("blur", function() {
    let value = this.value;
    if (!/^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.com$/.test(value)) {
        showError(this, "Enter valid email ending with .com");
        this.focus();
    } else {
        clearError(this);
    }
});

// Age Validation
document.getElementsByName("age")[0].addEventListener("blur", function() {
    let value = this.value;
    if (value < 17 || value > 30) {
        showError(this, "Age must be between 17 and 30");
        this.focus();
    } else {
        clearError(this);
    }
});

// Final Submit Validation
function validateForm(event) {

    let reg = document.getElementsByName("reg_number")[0];
    let name = document.getElementsByName("student_name")[0];
    let email = document.getElementsByName("email")[0];
    let age = document.getElementsByName("age")[0];
    let gender = document.querySelector('input[name="gender"]:checked');
    let course = document.getElementsByName("course")[0];

    if (!/^\d{10}$/.test(reg.value)) {
        showError(reg, "Register Number must be exactly 10 digits");
        reg.focus();
        event.preventDefault();
        return false;
    }

    if (!/^[A-Za-z\s]+$/.test(name.value)) {
        showError(name, "Name must contain only letters");
        name.focus();
        event.preventDefault();
        return false;
    }

    if (!/^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.com$/.test(email.value)) {
        showError(email, "Enter valid email ending with .com");
        email.focus();
        event.preventDefault();
        return false;
    }

    if (age.value < 17 || age.value > 30) {
        showError(age, "Age must be between 17 and 30");
        age.focus();
        event.preventDefault();
        return false;
    }

    if (!gender) {
        alert("Please select Gender");
        event.preventDefault();
        return false;
    }

    if (course.value === "") {
        alert("Please select Course");
        course.focus();
        event.preventDefault();
        return false;
    }

    alert("Form Submitted Successfully ✅");
    return true;
}

</script>


</body>
</html>
